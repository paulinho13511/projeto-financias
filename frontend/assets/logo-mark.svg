<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Minhas Finanças">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)"/>
  <!-- barras crescentes: crescimento do patrimônio -->
  <rect x="122" y="268" width="56" height="106" rx="18" fill="url(#bar)" opacity="0.72"/>
  <rect x="228" y="214" width="56" height="160" rx="18" fill="url(#bar)" opacity="0.86"/>
  <rect x="334" y="150" width="56" height="224" rx="18" fill="url(#bar)"/>
  <!-- moeda sobre a barra mais alta -->
  <circle cx="362" cy="122" r="46" fill="#0a0b10"/>
  <circle cx="362" cy="122" r="36" fill="none" stroke="#a78bfa" stroke-width="8"/>
  <circle cx="362" cy="122" r="12" fill="#ffffff"/>
</svg>
