<div class="sheet" id="aclSheet" hidden>
  <div class="sheetbox">
    <h2 style="font-size:17px;color:var(--text);text-transform:none;letter-spacing:0;margin:0">Quem tem acesso</h2>
    <p class="muted" style="font-size:13px">Crie o acesso com um e-mail e uma senha inicial. Envie os dois para a pessoa; ela pode trocar a senha depois.</p>
    <form id="aclForm" style="display:grid;gap:8px">
      <input type="email" id="aclEmail" placeholder="E-mail da pessoa" required>
      <input type="password" id="aclPw" placeholder="Senha inicial (mín. 10 caracteres)" autocomplete="new-password" required>
      <button type="submit" style="background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 16px;font-weight:600;min-height:46px">Criar acesso</button>
    </form>
    <div class="list" id="aclList"></div>
    <button class="close" id="aclClose">Fechar</button>
  </div>
</div>
