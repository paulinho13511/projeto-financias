<!-- Bloqueio ao abrir: digital ou rosto do aparelho (vale só neste aparelho) -->
<div class="sheet" id="btSheet" hidden>
  <div class="sheetbox ei" role="dialog" aria-modal="true" aria-labelledby="btTitulo">
    <div class="rl-topo">
      <h2 id="btTitulo">Bloqueio ao abrir</h2>
      <button type="button" class="rl-x" id="btFechar" aria-label="Fechar">×</button>
    </div>
    <p class="muted" id="btEstado"></p>
    <div class="rl-erro" id="btErro" role="alert"></div>
    <button type="button" class="primary rl-ok" id="btAtivar">Ativar com digital ou rosto</button>
    <button type="button" class="ghost" id="btDesligar" hidden>Desligar bloqueio neste aparelho</button>
  </div>
</div>
