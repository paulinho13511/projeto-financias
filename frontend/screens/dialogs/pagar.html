<!-- escolher a conta de onde sai o pagamento -->
<div class="modal" id="payModal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="payMsg">
    <p id="payMsg"></p>
    <select id="payAcc" aria-label="Conta de onde sai o dinheiro" style="width:100%;margin-top:12px"></select>
    <div class="btns">
      <button class="ghost" id="payNo" type="button">Cancelar</button>
      <button class="primary" id="payYes" type="button" style="padding:10px 16px;min-height:0">Pagar</button>
    </div>
  </div>
</div>
