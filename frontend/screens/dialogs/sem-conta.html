<!-- Lançamentos antigos sem conta nem cartão: o usuário escolhe a origem de cada um -->
<div class="sheet" id="scSheet" hidden>
  <div class="sheetbox sc" role="dialog" aria-modal="true" aria-labelledby="scTitulo">
    <div class="rl-topo">
      <h2 id="scTitulo">Lançamentos sem conta</h2>
      <button type="button" class="rl-x" id="scFechar" aria-label="Fechar">×</button>
    </div>
    <p class="muted sc-dica">Escolha de onde saiu (ou onde entrou) cada um. O que ficar em "Escolher…" continua como está.</p>
    <div class="sc-lista" id="scLista"></div>
    <button type="button" class="primary rl-ok" id="scSalvar">Salvar</button>
  </div>
</div>
