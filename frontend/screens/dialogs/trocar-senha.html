<div class="sheet" id="pwSheet" hidden>
  <div class="sheetbox">
    <h2 style="font-size:17px;color:var(--text);text-transform:none;letter-spacing:0;margin:0">Trocar minha senha</h2>
    <form id="pwForm" style="display:grid;gap:8px">
      <input type="password" id="newPw" placeholder="Nova senha (mín. 10 caracteres)" autocomplete="new-password" required>
      <input type="password" id="newPw2" placeholder="Confirme a nova senha" autocomplete="new-password" required>
      <button type="submit" style="background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 16px;font-weight:600;min-height:46px">Salvar nova senha</button>
    </form>
    <button class="close" id="pwClose">Cancelar</button>
  </div>
</div>
