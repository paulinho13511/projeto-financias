<div class="lock" id="lock" hidden>
  <div class="lk-fundo" aria-hidden="true"></div>
  <!-- 1º momento: tela preta só com a moeda girando. Só o toque NA moeda abre a fenda (o botão cobre apenas a moeda). -->
  <div class="lk-cena" id="lkCena">
    <div class="lk-palco">
      <div class="lk-brilho" aria-hidden="true"></div>
      <div class="lk-trilho" id="lkTrilho">
        <canvas class="lk-moeda" id="lkMoeda" width="520" height="520" aria-hidden="true"></canvas>
        <img class="lk-moeda-img" src="frontend/assets/logo-mark.svg" alt="" hidden>
      </div>
      <div class="lk-fenda" id="lkFenda" aria-hidden="true"></div>
      <button class="lk-toque" id="lkToque" type="button" aria-label="Tocar na moeda para entrar"></button>
    </div>
    <p class="lk-dica" id="lkDica">Toque na moeda</p>
    <button class="lk-pular" id="lkPular" type="button">Entrar sem animação</button>
  </div>
  <!-- 2º momento: depois que a moeda entra na fenda, o login aparece centralizado com o logo -->
  <section class="lk-panel" id="lkPanel">
    <div class="lk-logo" id="lkLogo"><img src="frontend/assets/logo-mark.svg" alt="Logo TravaDin"></div>
    <div class="lk-brand">TravaDin</div>
    <p class="lk-tag">Seu dinheiro sob controle</p>
    <div class="skeleton" id="lockSkel" hidden style="height:200px;width:100%"></div>
    <form class="lk-form" id="lockForm">
      <h1 id="lockTitle" hidden>Entrar</h1>
      <p id="lockText" hidden>Entre com seu e-mail e senha.</p>
      <label class="lk-fld">E-mail<input type="email" id="email" placeholder="seu@email.com" autocomplete="username" required></label>
      <label class="lk-fld">Senha<input type="password" id="pw" placeholder="Sua senha" autocomplete="current-password" required></label>
      <div class="lk-err" id="lockErr" role="alert"></div>
      <button class="lk-btn" type="submit" id="lockBtn">Entrar</button>
      <p class="lk-foot">Não tem conta? Peça ao administrador para liberar seu acesso.</p>
    </form>
  </section>
</div>
