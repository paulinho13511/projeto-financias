<div class="lock" id="lock" hidden>
  <div class="lk-shell">
    <section class="lk-stage" aria-hidden="true">
      <canvas class="lk-canvas"></canvas>
    </section>
    <section class="lk-panel">
      <div class="lk-logo"><img src="frontend/assets/logo-mark.svg" alt=""></div>
      <div class="lk-brand">Minhas Finanças</div>
      <p class="lk-tag">Seu dinheiro sob controle</p>
      <div class="skeleton" id="lockSkel" hidden style="height:260px;width:100%"></div>
      <form class="lk-form" id="lockForm">
        <h1 id="lockTitle" hidden>Entrar</h1>
        <p id="lockText" hidden>Entre com seu e-mail e senha.</p>
        <label class="lk-fld">E-mail<input type="email" id="email" placeholder="seu@email.com" autocomplete="username" required></label>
        <label class="lk-fld">Senha<input type="password" id="pw" placeholder="Sua senha" autocomplete="current-password" required></label>
        <div class="lk-err" id="lockErr" role="alert"></div>
        <button class="lk-btn" type="submit" id="lockBtn">Entrar</button>
        <p class="lk-foot">Não tem conta? Peça ao administrador para liberar seu acesso.</p>
      </form>
    </section>
  </div>
</div>
