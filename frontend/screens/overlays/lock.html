<div class="lock" id="lock" hidden>
  <div class="authBg" aria-hidden="true">
  <svg class="wave waveTop" viewBox="0 0 2880 200" preserveAspectRatio="none">
  <path fill="rgba(139,92,246,.10)" transform="translate(0,28)" d="M0,120 C240,50 480,170 720,110 C960,50 1200,170 1440,120 C1680,50 1920,170 2160,110 C2400,50 2640,170 2880,120 L2880,0 L0,0 Z"/>
  <path fill="#14264a" d="M0,110 C240,160 480,40 720,100 C960,160 1200,40 1440,110 C1680,160 1920,40 2160,100 C2400,160 2640,40 2880,110 L2880,0 L0,0 Z"/>
  </svg>
  <svg class="wave waveBottom" viewBox="0 0 2880 200" preserveAspectRatio="none">
  <path fill="rgba(139,92,246,.08)" transform="translate(0,-26)" d="M0,80 C240,150 480,20 720,90 C960,150 1200,20 1440,80 C1680,150 1920,20 2160,90 C2400,150 2640,20 2880,80 L2880,200 L0,200 Z"/>
  <path fill="#0e1b35" d="M0,100 C240,40 480,170 720,110 C960,40 1200,170 1440,100 C1680,40 1920,170 2160,110 C2400,40 2640,170 2880,100 L2880,200 L0,200 Z"/>
  </svg>
  </div>
  <div class="lk-shell">
    <section class="lk-stage" aria-hidden="true">
      <canvas class="lk-canvas"></canvas>
    </section>
    <section class="lk-panel">
      <div class="lk-logo"><img src="frontend/assets/logo-mark.svg" alt=""></div>
      <div class="lk-brand">Minhas Finanças</div>
      <p class="lk-tag">Seu dinheiro sob controle</p>
      <div class="skeleton" id="lockSkel" hidden style="height:260px;width:100%"></div>
      <form class="lk-form" id="lockForm">
        <h1 id="lockTitle" hidden>Entrar</h1>
        <p id="lockText" hidden>Entre com seu e-mail e senha.</p>
        <label class="lk-fld">E-mail<input type="email" id="email" placeholder="seu@email.com" autocomplete="username" required></label>
        <label class="lk-fld">Senha<input type="password" id="pw" placeholder="Sua senha" autocomplete="current-password" required></label>
        <div class="lk-err" id="lockErr" role="alert"></div>
        <button class="lk-btn" type="submit" id="lockBtn">Entrar</button>
        <p class="lk-foot">Não tem conta? Peça ao administrador para liberar seu acesso.</p>
      </form>
    </section>
  </div>
</div>
