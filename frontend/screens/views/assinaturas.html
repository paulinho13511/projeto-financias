  <!-- ASSINATURAS -->
  <section class="view" id="v-subs">
    <div class="card">
      <h2>Assinaturas recorrentes</h2>
      <div class="sboxes">
        <div class="sbox"><small>Neste mês</small><b id="subMonth"></b></div>
        <div class="sbox"><small>Por ano (projeção)</small><b id="subYear"></b></div>
        <div class="sbox"><small>Acumulado no ano</small><b id="subAcc"></b></div>
      </div>
    </div>
    <div class="card" id="subUsoCard" hidden>
      <h2>Ainda usa?</h2>
      <p class="muted" style="margin-bottom:12px">A cada 3 meses o app pergunta se você ainda usa cada assinatura.</p>
      <div class="list" id="subUso"></div>
    </div>
    <div class="card">
      <h2>Neste mês</h2>
      <div class="list" id="subList"></div>
    </div>
  </section>
