  <!-- CONTAS -->
  <section class="view" id="v-contas">
    <div class="card">
      <h2>Nova conta fixa</h2>
      <form class="f" id="billForm">
        <div class="seg seg3 full">
          <label><input type="radio" name="kind" value="mensal" checked><span>Todo mês</span></label>
          <label><input type="radio" name="kind" value="parcelada"><span>Parcelada</span></label>
          <label><input type="radio" name="kind" value="unica"><span>Única</span></label>
        </div>
        <input class="full" id="bName" placeholder="Nome (ex.: Aluguel, Notebook, Internet)" required>
        <input id="bAmt" type="number" step="0.01" min="0.01" placeholder="Valor (R$)" required>
        <input id="bDay" type="number" min="1" max="31" placeholder="Dia do vencimento" required>
        <input id="bDate" type="date" hidden>
        <div class="full" id="endBox" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <select id="bEndType"><option value="forever">Para sempre</option><option value="until">Até um mês</option></select>
          <input id="bEnd" type="month" hidden title="Último mês em que a conta aparece">
        </div>
        <div class="full" id="parcBox" hidden style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <input id="bParcels" type="number" min="2" max="120" placeholder="Nº de parcelas">
          <input id="bStart" type="month" title="Mês da 1ª parcela">
        </div>
        <div class="muted full" id="parcTotal" hidden></div>
        <select class="full" id="bCard"></select>
        <select class="full" id="bCat"></select>
        <label class="chk full"><input type="checkbox" id="bSub"> É assinatura (Netflix, Spotify, academia...)</label>
        <button class="primary full" type="submit">Cadastrar</button>
      </form>
    </div>
    <div class="card">
      <h2>Contas do mês · <span id="billMonthLabel"></span></h2>
      <div class="list" id="billsList"></div>
    </div>

  <!-- CARTÕES (dentro de Contas) -->
  <div class="card" style="margin-top:0" data-cards>
    <h2>Cartões de crédito</h2>
    <form class="f" id="cardForm">
      <input class="full" id="cName" placeholder="Nome do cartão (ex.: Nubank, Itaú)" required>
      <input id="cClose" type="number" min="1" max="31" placeholder="Dia que fecha a fatura" required>
      <input id="cDue" type="number" min="1" max="31" placeholder="Dia do vencimento" required>
      <button class="primary full" type="submit">Cadastrar cartão</button>
    </form>
    <div class="list" id="cardList" style="margin-top:14px"></div>
  </div>
  </section>
