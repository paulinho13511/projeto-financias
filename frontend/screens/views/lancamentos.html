  <!-- LANÇAMENTOS: uma coluna só. Em cima: lançar, buscar e filtrar. Embaixo: o histórico na largura toda. -->
  <section class="view" id="v-lanc">
    <div class="card lc-topo">
      <div class="lc-cab">
        <h2>Buscar e filtrar</h2>
        <button class="primary lc-novo" type="button" data-act="abrirRelampago">+ Lançar agora</button>
      </div>
      <div class="lc-filtros">
        <input id="search" class="lc-busca" type="search" placeholder="Buscar por descrição ou categoria" aria-label="Buscar">
        <select id="filterType" aria-label="Tipo">
          <option value="all">Todos</option>
          <option value="expense">Despesas</option>
          <option value="income">Receitas</option>
          <option value="transfer">Transferências</option>
        </select>
        <select id="fSort" aria-label="Ordenar">
          <option value="recent">Mais recentes</option>
          <option value="high">Maior valor</option>
          <option value="low">Menor valor</option>
        </select>
        <label class="lc-data"><span>De</span><input type="date" id="fFrom"></label>
        <label class="lc-data"><span>Até</span><input type="date" id="fTo"></label>
      </div>
      <div class="chips lc-cartoes" id="fCards"></div>
    </div>
    <div class="card lc-hist">
      <h2>Histórico</h2>
      <div id="feed"></div>
    </div>
  </section>
