  <!-- METAS -->
  <section class="view" id="v-metas">
    <div class="card" id="goalCard">
      <h2>Metas e caixinhas</h2>
      <div class="list" id="goalList" style="margin-bottom:16px"></div>
      <h3 class="sub">Criar meta</h3>
      <form class="f" id="goalForm">
        <label class="fld full">Nome da meta<input id="gName" placeholder="Ex.: Reserva, Viagem" required></label>
        <label class="fld">Valor final (R$)<input id="gTarget" type="text" inputmode="decimal" autocomplete="off" data-money placeholder="0,00" required></label>
        <label class="fld">Prazo<input id="gDeadline" type="month" required></label>
        <button class="primary full" type="submit">Criar meta</button>
      </form>
    </div>
    <div class="card" id="desafioCard">
      <h2>Desafio</h2>
      <div id="desafio"></div>
    </div>
    <div class="card" id="sobraRegraCard" hidden>
      <h2>Sobra do ciclo</h2>
      <div id="sobraRegra"></div>
    </div>

  </section>
